<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가능한 시간 선택</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Noto Sans KR", sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;      
            padding: 40px; 
        }

        .full-wrapper {
            width: 100%;
            max-width: 900px; 
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            text-align: center; 
            margin-bottom: 5px;
        }

        p.sub-title {
            text-align: center;
            color: #666;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .calendar-box {
            width: 100%;
            background-color: #ffffff;
        }

        .cal-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            margin-bottom: 25px;
        }

        .cal-header span {
            font-size: 24px;
            font-weight: bold;
            color: #000;
        }

        .arrow-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #000;
            padding: 0 10px;
            outline: none;
        }

        .timeline-scroll-container {
            width: 100%;
            max-height: 60vh; 
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
        }

        .timeline-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            background-color: #fff;
        }

        .timeline-table th,
        .timeline-table td {
            border: none;
            box-shadow: 0 0 0 0.5px #e0e0e0;
            text-align: center;
            vertical-align: middle;
        }

        .timeline-table thead th {
            height: 50px;
            background-color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            color: #333333;
        }

        .timeline-table thead th:nth-child(2),
        .timeline-table thead th:nth-child(8) {
            color: #9e9e9e;
        }

        .timeline-table thead th.empty-corner {
            width: 10%;
        }

        .timeline-table td.time-col-cell {
            font-size: 14px;
            font-weight: 400;
            color: #555555;
            background-color: #ffffff;
            width: 10%;
            height: 50px;
        }

        .timeline-table td.sched-cell {
            height: 50px;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .timeline-table td.sched-cell:hover {
            background-color: #f1f3f4;
        }

        .timeline-table td.sched-cell.selected {
            background-color: rgba(30, 115, 230, 0.7) !important;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center; 
            margin-top: 15px;
        }

        .btn {
            width: 150px;
            height: 50px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-cancel {
            background-color: #f5f5f5;
            color: #555;
        }
        .btn-cancel:hover {
            background-color: #e5e5e5;
        }

        .btn-save {
            background-color: #1e73e6;
            color: #fff;
        }
        .btn-save:hover {
            background-color: #004fb0;
        }
    </style>
</head>
<body>

    <div class="full-wrapper">
        <h2>일정 추가</h2>
        <p class="sub-title">내가 만날 수 있는 요일과 시간 칸들을 클릭하여 등록해 주세요.</p>

        <div class="calendar-box">
            <div class="cal-header">
                <button type="button" class="arrow-btn" id="prev-week-btn">&lt;</button>
                <span id="week-title">-월 -주</span>
                <button type="button" class="arrow-btn" id="next-week-btn">&gt;</button>
            </div>
            
            <div class="timeline-scroll-container">
                <table class="timeline-table">
                    <thead>
                        <tr>
                            <th class="empty-corner"></th>
                            <th id="day-0">일</th>
                            <th id="day-1">월</th>
                            <th id="day-2">화</th>
                            <th id="day-3">수</th>
                            <th id="day-4">목</th>
                            <th id="day-5">금</th>
                            <th id="day-6">토</th>
                        </tr>
                    </thead>
                    <tbody id="timeline-hours-body">
                        </tbody>
                </table>
            </div>
        </div>

        <div class="btn-group">
            <a href="main.html" class="btn btn-cancel">취소</a>
            <button type="button" id="save-btn" class="btn btn-save">선택 완료</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './src/supabase.js';
        window.supabaseInstance = supabase; 
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const passedDateStr = urlParams.get('date');

            let currentDate = new Date(); 
            if (passedDateStr && !isNaN(Date.parse(passedDateStr))) {
                currentDate = new Date(passedDateStr);
            }

            const weekTitle = document.getElementById("week-title");
            const timelineHoursBody = document.getElementById("timeline-hours-body");

            let selectedSlots = JSON.parse(localStorage.getItem("savedTimeSlots")) || {};

            function getWeekOfMonth(date) {
                const firstDayOfMonth = new Date(date.getFullYear(), date.getMonth(), 1);
                const startDay = firstDayOfMonth.getDay();
                const currentDay = date.getDate();
                return Math.ceil((currentDay + startDay) / 7);
            }

            function renderTimelineTable() {
                timelineHoursBody.innerHTML = "";

                const weekNum = getWeekOfMonth(currentDate);
                weekTitle.textContent = `${currentDate.getMonth() + 1}월 ${weekNum}주`;

                const currentDayOfWeek = currentDate.getDay();
                const sundayDate = new Date(currentDate);
                sundayDate.setDate(currentDate.getDate() - currentDayOfWeek);

                const weekDatesStrs = [];
                for (let i = 0; i < 7; i++) {
                    const loopDate = new Date(sundayDate);
                    loopDate.setDate(sundayDate.getDate() + i);
                    const y = loopDate.getFullYear();
                    const m = String(loopDate.getMonth() + 1).padStart(2, '0');
                    const d = String(loopDate.getDate()).padStart(2, '0');
                    weekDatesStrs.push(`${y}-${m}-${d}`);

                    const headerCell = document.getElementById(`day-${i}`);
                    const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
                    if (headerCell) {
                        headerCell.innerHTML = `${dayNames[i]}<br><span style="font-size:12px; font-weight:normal; color:#767676;">${loopDate.getDate()}일</span>`;
                    }
                }

                for (let hour = 0; hour <= 24; hour++) {
                    const tr = document.createElement("tr");

                    const tdTime = document.createElement("td");
                    tdTime.classList.add("time-col-cell");
                    tdTime.textContent = String(hour).padStart(2, "0");
                    tr.appendChild(tdTime);

                    for (let day = 0; day < 7; day++) {
                        const tdSched = document.createElement("td");
                        tdSched.classList.add("sched-cell");

                        const slotKey = `${weekDatesStrs[day]}_${hour}`;

                        if (selectedSlots[slotKey]) {
                            tdSched.classList.add("selected");
                        }

                        tdSched.addEventListener("click", () => {
                            if (tdSched.classList.contains("selected")) {
                                tdSched.classList.remove("selected");
                                delete selectedSlots[slotKey];
                            } else {
                                tdSched.classList.add("selected");
                                selectedSlots[slotKey] = true;
                            }
                        });

                        tr.appendChild(tdSched);
                    }

                    timelineHoursBody.appendChild(tr);
                }
            }

            document.getElementById("prev-week-btn").addEventListener("click", (e) => {
                e.preventDefault();
                currentDate.setDate(currentDate.getDate() - 7);
                renderTimelineTable();
            });
            
            document.getElementById("next-week-btn").addEventListener("click", (e) => {
                e.preventDefault();
                currentDate.setDate(currentDate.getDate() + 7);
                renderTimelineTable();
            });

            // 선택 완료 버튼 클릭 시 브라우저에 저장하고 복귀
            document.getElementById('save-btn').addEventListener('click', () => {
                localStorage.setItem("savedTimeSlots", JSON.stringify(selectedSlots));
                alert('가능한 시간대 등록이 모두 완료되었습니다');
                location.href = 'main.html';
            });

            renderTimelineTable();
        });
    </script>
</body>
</html>
