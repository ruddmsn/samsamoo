<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>삼삼오오 - 일정 추가</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Noto Sans KR", sans-serif;
      }

      body {
        min-height: 100vh;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
      }

      .header {
        display: flex;
        align-items: center;
        width: 100%;
        height: 100px;
        padding: 0 40px;
        border-bottom: 1px solid #e0e0e0;
      }

      .header h1 {
        font-size: 24px;
        font-weight: 700;
        color: #1e73e6;
      }

      .main-container {
        display: flex;
        flex: 1;
      }

      .sidebar {
        width: 280px;
        border-right: 1px solid #e0e0e0;
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .info-box {
        background-color: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 12px;
        padding: 20px;
      }

      .info-box h3 {
        font-size: 16px;
        margin-bottom: 8px;
        color: #333;
      }

      .info-box p {
        font-size: 14px;
        color: #666;
        line-height: 1.5;
      }

      .btn-submit {
        width: 100%;
        height: 50px;
        background-color: #1e73e6;
        color: white;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .btn-submit:hover {
        background-color: #1a62cc;
      }

      .content-view {
        flex: 1;
        padding: 40px;
        overflow-y: auto;
      }

      .week-title-area {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 25px;
        color: #222;
      }

      .timetable-wrapper {
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        overflow: hidden;
      }

      .time-table {
        width: 100%;
        border-collapse: collapse;
        user-select: none;
      }

      .time-table th,
      .time-table td {
        border: 1px solid #e0e0e0;
        text-align: center;
        vertical-align: middle;
      }

      .time-table th {
        height: 50px;
        background-color: #ffffff;
        font-size: 16px;
        font-weight: 400;
        color: #333333;
      }

      .time-table th.time-corner {
        width: 12%;
        background-color: #ffffff;
      }

      .time-table td.time-label {
        height: 50px;
        font-size: 14px;
        color: #777;
        background-color: #ffffff;
      }

      .time-table td.slot-cell {
        cursor: pointer;
        background-color: #ffffff;
        transition: background-color 0.1s;
      }

      .time-table td.slot-cell.selected {
        background-color: #a4cafe !important;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>일정 추가</h1>
    </div>

    <div class="main-container">
      <div class="sidebar">
        <div class="info-box">
          <h3>드래그 안내</h3>
          <p>원하는 시간대 칸들을 마우스로 클릭하거나 아래로 드래그하여 다중 선택할 수 있습니다.</p>
        </div>
        <button class="btn-submit" id="save-schedule-btn">선택 완료 및 저장</button>
      </div>

      <div class="content-view">
        <div class="week-title-area" id="event-week-title">선택한 주간 드래그하기</div>
        <div class="timetable-wrapper">
          <table class="time-table">
            <thead>
              <tr>
                <th class="time-corner"></th>
                <th id="col-day-0">-</th>
                <th id="col-day-1">-</th>
                <th id="col-day-2">-</th>
                <th id="col-day-3">-</th>
                <th id="col-day-4">-</th>
                <th id="col-day-5">-</th>
                <th id="col-day-6">-</th>
              </tr>
            </thead>
            <tbody id="event-hours-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script type="module">
      import { supabase } from "/src/supabase.js";

      const eventWeekTitle = document.getElementById("event-week-title");
      const eventHoursBody = document.getElementById("event-hours-body");
      const saveScheduleBtn = document.getElementById("save-schedule-btn");

      const urlParams = new URLSearchParams(window.location.search);
      const paramDate = urlParams.get("date");
      let baseDate = paramDate ? new Date(paramDate) : new Date();

      let tempSelectedSlots = {}; 
      let isDragging = false;
      let currentLoggedInUser = "user";

      supabase.auth.onAuthStateChange((event, session) => {
        if (session && session.user) {
          const meta = session.user.user_metadata;
          currentLoggedInUser = meta?.username || meta?.id || meta?.name || (session.user.email ? session.user.email.split("@")[0] : "user");
        }
      });

      function getWeekOfMonth(date) {
        const firstDayOfMonth = new Date(date.getFullYear(), date.getMonth(), 1);
        const startDay = firstDayOfMonth.getDay();
        return Math.ceil((date.getDate() + startDay) / 7);
      }

      function initEventPage() {
        const month = baseDate.getMonth() + 1;
        const weekNum = getWeekOfMonth(baseDate);
        eventWeekTitle.textContent = `${month}월 ${weekNum}주`;

        const currentDayOfWeek = baseDate.getDay();
        const sundayDate = new Date(baseDate);
        sundayDate.setDate(baseDate.getDate() - currentDayOfWeek);

        const weekDates = [];
        for (let i = 0; i < 7; i++) {
          const loopDate = new Date(sundayDate);
          loopDate.setDate(sundayDate.getDate() + i);
          const y = loopDate.getFullYear();
          const m = String(loopDate.getMonth() + 1).padStart(2, "0");
          const d = String(loopDate.getDate()).padStart(2, "0");
          
          weekDates.push(`${y}-${m}-${d}`);

          const colHeader = document.getElementById(`col-day-${i}`);
          if (colHeader) {
            colHeader.textContent = loopDate.getDate();
          }
        }

        eventHoursBody.innerHTML = "";

        const savedSlots = JSON.parse(localStorage.getItem("finalTimeSlots")) || {};

        for (let hour = 0; hour <= 24; hour++) {
          const tr = document.createElement("tr");

          const tdTime = document.createElement("td");
          tdTime.classList.add("time-label");
          tdTime.textContent = `${String(hour).padStart(2, "0")}:00`;
          tr.appendChild(tdTime);

          for (let day = 0; day < 7; day++) {
            const tdSlot = document.createElement("td");
            tdSlot.classList.add("slot-cell");
            
            const slotKey = `${weekDates[day]}_${hour}`;

            if (savedSlots[slotKey]) {
              tdSlot.classList.add("selected");
              tempSelectedSlots[slotKey] = true;
            }

            tdSlot.setAttribute("data-key", slotKey);

            tdSlot.addEventListener("mousedown", () => {
              isDragging = true;
              toggleSlot(tdSlot, slotKey);
            });

            tdSlot.addEventListener("mouseenter", () => {
              if (isDragging) {
                toggleSlot(tdSlot, slotKey);
              }
            });

            tr.appendChild(tdSlot);
          }
          eventHoursBody.appendChild(tr);
        }
      }

      function toggleSlot(element, key) {
        if (tempSelectedSlots[key]) {
          delete tempSelectedSlots[key];
          element.classList.remove("selected");
        } else {
          tempSelectedSlots[key] = true;
          element.classList.add("selected");
        }
      }

      document.addEventListener("mouseup", () => {
        isDragging = false;
      });

      saveScheduleBtn.addEventListener("click", () => {
        const savedGlobalSlots = JSON.parse(localStorage.getItem("finalTimeSlots")) || {};
        
        const currentDayOfWeek = baseDate.getDay();
        const sundayDate = new Date(baseDate);
        sundayDate.setDate(baseDate.getDate() - currentDayOfWeek);
        const activeWeekDates = [];
        for (let i = 0; i < 7; i++) {
          const loopDate = new Date(sundayDate);
          loopDate.setDate(sundayDate.getDate() + i);
          const y = loopDate.getFullYear();
          const m = String(loopDate.getMonth() + 1).padStart(2, "0");
          const d = String(loopDate.getDate()).padStart(2, "0");
          activeWeekDates.push(`${y}-${m}-${d}`);
        }

        for (const key in savedGlobalSlots) {
          const datePart = key.split("_")[0];
          if (activeWeekDates.includes(datePart)) {
            delete savedGlobalSlots[key];
          }
        }

        for (const key in tempSelectedSlots) {
          savedGlobalSlots[key] = true;
        }

        localStorage.setItem("finalTimeSlots", JSON.stringify(savedGlobalSlots));
        localStorage.setItem("finalTimeUserName", currentLoggedInUser);

        alert("일정이 완벽하게 반영되었습니다!");

        const y = baseDate.getFullYear();
        const m = String(baseDate.getMonth() + 1).padStart(2, "0");
        const d = String(baseDate.getDate()).padStart(2, "0");
        location.href = `main.html?date=${y}-${m}-${d}`;
      });

      initEventPage();
    </script>
  </body>
</html>
