<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모임 생성 페이지</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Noto Sans KR", sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #fff;
      }

      .container {
        width: 100%;
        max-width: 450px;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .title-area h2 {
        font-size: 28px;
        font-weight: bold;
        color: #1e73e6;
        text-align: center;
        margin-bottom: 8px;
      }

      .title-area p {
        font-size: 15px;
        color: #7a7a7a;
        text-align: center;
      }

      .form-area {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .input-field {
        width: 100%;
        height: 65px;
        border: 1px solid #1e73e6;
        border-radius: 12px;
        background-color: #ffffff;
        padding: 0 20px;
        font-size: 18px;
        outline: none;
      }

      .input-field::placeholder {
        color: #b5b5b5;
      }

      .submit-btn {
        width: 100%;
        height: 65px;
        border: none;
        border-radius: 12px;
        background-color: #0062d2;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 4px;
        transition: background-color 0.2s;
      }

      .submit-btn:hover {
        background-color: #004fb0;
      }

      .code-result-box {
        display: none;
        background-color: #f4f8ff;
        border: 1px dashed #1e73e6;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        margin-top: 10px;
      }

      .code-text {
        font-size: 32px;
        font-weight: bold;
        color: #0062d2;
        letter-spacing: 2px;
        margin-top: 10px;
      }

      .back-link {
        text-align: center;
        color: #7a7a7a;
        font-size: 15px;
        text-decoration: none;
        margin-top: 8px;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .cancel-link {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="title-area">
        <h2>새 모임 만들기</h2>
        <p>우리 팀만의 일정을 공유할 방을 생성하세요.</p>
      </div>

      <form class="form-area" id="group-form" onsubmit="return false;">
        <input
          type="text"
          id="group-name"
          class="input-field"
          placeholder="모임 이름을 입력하세요"
        />
        <button type="submit" class="submit-btn" id="create-btn">
          모임 생성 및 코드 발급
        </button>
      </form>

      <div class="code-result-box" id="result-box">
        <p style="color: #333">모임 생성 완료 친구들에게 코드를 공유하세요.</p>
        <div class="code-text" id="generated-code">------</div>
        <a
          href="main.html"
          class="back-link"
          style="display: block; margin-top: 20px"
          >메인 화면으로 돌아가기</a
        >
      </div>

      <a href="main.html" class="back-link" id="cancel-link"
        >취소하고 돌아가기</a
      >
    </div>

    <script type="module">
      import { supabase } from "/src/supabase.js";

      function idToRandomCode(id) {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let seed = parseInt(id) * 1234567 + 987654321;
        let result = "";
        for (let i = 0; i < 6; i++) {
          seed = (seed * 1103515245 + 12345) & 0x7fffffff;
          result += chars.charAt(seed % chars.length);
        }
        return result;
      }

      document
        .getElementById("create-btn")
        .addEventListener("click", async (e) => {
          e.preventDefault();

          const groupName = document.getElementById("group-name").value.trim();

          if (!groupName) {
            alert("모임 이름을 입력해 주세요");
            return;
          }

          try {
            const {
              data: { user },
              error: userError,
            } = await supabase.auth.getUser();

            if (userError || !user) {
              alert("로그인 세션이 만료되었거나 정보가 없습니다. 다시 로그인 해주세요.");
              window.location.href = "signin.html";
              return;
            }

            const { data, error } = await supabase
              .from("groups")
              .insert([
                {
                  title: groupName,
                  owner_id: user.id,
                  meeting_date: new Date(),
                },
              ])
              .select();

            if (error) throw error;

            const generatedId = data && data[0] ? data[0].id : 0;
            const randomCode = idToRandomCode(generatedId);

            document.getElementById("group-form").style.display = "none";
            document.getElementById("cancel-link").style.display = "none";

            document.getElementById("generated-code").textContent = randomCode;
            document.getElementById("result-box").style.display = "block";
          } catch (err) {
            alert("모임 생성 실패: " + err.message);
            console.error("에러 상세 정보:", err);
          }
        });
    </script>
  </body>
</html>
