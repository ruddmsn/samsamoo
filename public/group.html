<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모임 생성 페이지</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Noto Sans KR", sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #fff;
      }

      .container {
        width: 100%;
        max-width: 450px;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .title-area h2 {
        font-size: 28px;
        font-weight: bold;
        color: #1e73e6;
        text-align: center;
        margin-bottom: 8px;
      }

      .title-area p {
        font-size: 15px;
        color: #7a7a7a;
        text-align: center;
      }

      .form-area {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .input-field {
        width: 100%;
        height: 65px;
        border: 1px solid #1e73e6;
        border-radius: 12px;
        background-color: #ffffff;
        padding: 0 20px;
        font-size: 18px;
        outline: none;
      }

      .input-field::placeholder {
        color: #b5b5b5;
      }

      .submit-btn {
        width: 100%;
        height: 65px;
        border: none;
        border-radius: 12px;
        background-color: #0062d2;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 4px;
        transition: background-color 0.2s;
      }

      .submit-btn:hover {
        background-color: #004fb0;
      }

      .code-result-box {
        display: none;
        background-color: #f4f8ff;
        border: 1px dashed #1e73e6;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        margin-top: 10px;
      }

      .code-text {
        font-size: 32px;
        font-weight: bold;
        color: #0062d2;
        letter-spacing: 2px;
        margin-top: 10px;
      }

      .back-link {
        text-align: center;
        color: #7a7a7a;
        font-size: 15px;
        text-decoration: none;
        margin-top: 8px;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .cancel-link {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="title-area">
        <h2>새 모임 만들기</h2>
        <p>우리 팀만의 일정을 공유할 방을 생성하세요.</p>
      </div>

      <form class="form-area" id="group-form" onsubmit="return false;">
        <input
          type="text"
          id="group-name"
          class="input-field"
          placeholder="모임 이름을 입력하세요"
        />
        <button type="submit" class="submit-btn" id="create-btn">
          모임 생성 및 코드 발급
        </button>
      </form>

      <div class="code-result-box" id="result-box">
        <p style="color: #333">모임 생성 완료 친구들에게 코드를 공유하세요.</p>
        <div class="code-text" id="generated-code">------</div>
        <a
          href="main.html"
          class="back-link"
          style="display: block; margin-top: 20px"
          >메인 화면으로 돌아가기</a
        >
      </div>

      <a href="main.html" class="back-link" id="cancel-link"
        >취소하고 돌아가기</a
      >
    </div>

    <script type="module">
      import { supabase } from "/src/supabase.js";

      // 1. 버튼 클릭 이벤트 리스너 등록
      document
        .getElementById("create-btn")
        .addEventListener("click", async (e) => {
          e.preventDefault(); // 폼 제출로 인한 새로고침 방지

          const groupName = document.getElementById("group-name").value.trim();

          // 모임 이름 빈값 체크
          if (!groupName) {
            alert("모임 이름을 입력해 주세요");
            return;
          }

          try {
            // 2. 🔑 현재 로그인한 유저 정보 가져오기 (owner_id에 넣을 값)
            const {
              data: { user },
              error: userError,
            } = await supabase.auth.getUser();

            if (userError || !user) {
              alert(
                "로그인 세션이 만료되었거나 정보가 없습니다. 다시 로그인 해주세요.",
              );
              window.location.href = "signin.html";
              return;
            }

            // 3. 💾 실제 Supabase 'groups' 테이블에 들어있는 컬럼에만 맞춰서 insert
            // (주의: room_code 컬럼이 테이블에 없으므로 일단 제외하고 실제 있는 컬럼만 채웁니다)
            const { data, error } = await supabase
              .from("groups")
              .insert([
                {
                  title: groupName, // 모임 이름
                  owner_id: user.id, // 현재 로그인한 사람의 UUID
                  meeting_date: new Date(), // 모임 생성 날짜 (오늘 날짜 기본 주입)
                },
              ])
              .select(); // insert 후 결과 데이터를 받아오기 위해 필수

            if (error) throw error;

            // 4. 🎉 성공 시 UI 변경
            // (room_code 컬럼 대신 자동 생성된 고유 id 숫자를 화면에 대신 띄워 친구들에게 공유할 수 있게 처리)
            const generatedId = data && data[0] ? data[0].id : "SUCCESS";

            document.getElementById("group-form").style.display = "none";
            document.getElementById("cancel-link").style.display = "none";

            document.getElementById("generated-code").textContent =
              `ROOM-${generatedId}`;
            document.getElementById("result-box").style.display = "block";
          } catch (err) {
            alert("모임 생성 실패: " + err.message);
            console.error("에러 상세 정보:", err);
          }
        });
    </script>
  </body>
</html>
